<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#142033" />
  <title>Униформа Онлайн — кабинет компании</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="login-screen">
    <div class="login-panel">
      <div class="login-brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-eyebrow">Кабинет сотрудника</p>
          <h1>Униформа Онлайн</h1>
        </div>
      </div>
      <form id="login-form" class="login-form" autocomplete="off">
        <label class="field">
          <span>Электронная почта</span>
          <input type="email" id="login-email" value="ops@uniforma.online" required />
        </label>
        <label class="field">
          <span>Пароль</span>
          <div class="password-field" data-password-field>
            <input type="password" id="login-password" value="demo" required />
            <button type="button" class="btn-icon password-toggle" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
        </label>
        <fieldset class="role-pick">
          <legend>Войти как</legend>
          <label class="role-card">
            <input type="radio" name="role" value="owner" checked />
            <span class="role-card-body">
              <strong>Владелец</strong>
              <small>Полный доступ, включая сотрудников</small>
            </span>
          </label>
          <label class="role-card">
            <input type="radio" name="role" value="admin" />
            <span class="role-card-body">
              <strong>Администратор</strong>
              <small>Заявки, оплаты, каталог, настройки</small>
            </span>
          </label>
          <label class="role-card">
            <input type="radio" name="role" value="moderator" />
            <span class="role-card-body">
              <strong>Модератор</strong>
              <small>Регистрации и просмотр заявок</small>
            </span>
          </label>
        </fieldset>
        <button type="submit" class="btn btn-primary btn-block">Войти в кабинет</button>
        <p class="login-hint">Демо-превью без сервера. Действия имитируются на ваших данных в браузере.</p>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden" aria-hidden="true">
    <div id="nav-backdrop" class="nav-backdrop hidden" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Навигация кабинета" aria-expanded="true">
      <div class="sidebar-top">
        <div class="sidebar-brand-slot">
          <div class="sidebar-brand sidebar-brand--full">
            <div class="brand-mark brand-mark-sm" aria-hidden="true"></div>
            <div class="sidebar-brand-text">
              <strong>Униформа Онлайн</strong>
              <span>Кабинет компании</span>
            </div>
          </div>
          <div class="sidebar-brand sidebar-brand--collapsed" aria-hidden="true">
            <div class="brand-mark brand-mark-sm" aria-hidden="true"></div>
          </div>
          <button type="button" class="sidebar-collapse sidebar-expand" id="btn-sidebar-expand" aria-label="Развернуть меню" data-tooltip="Развернуть меню" data-tooltip-placement="right">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16M15 9l3 3-3 3"/></svg>
          </button>
        </div>
        <button type="button" class="sidebar-collapse" id="btn-sidebar-collapse" aria-label="Свернуть меню" data-tooltip="Свернуть меню" data-tooltip-placement="left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16M15 9l3 3-3 3"/></svg>
        </button>
        <button type="button" class="sidebar-close-mobile" id="btn-nav-close" aria-label="Закрыть меню">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user">
          <div class="user-avatar" id="user-avatar">В</div>
          <div class="user-meta" id="user-meta" role="button" tabindex="0" title="Открыть профиль">
            <strong id="user-name">—</strong>
            <span id="user-role">—</span>
          </div>
          <button type="button" class="sidebar-logout" id="btn-logout" aria-label="Выйти" data-tooltip="Выйти" data-tooltip-placement="top">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="sidebar-edge" id="btn-sidebar-edge" aria-label="Свернуть или развернуть меню" data-tooltip="Свернуть или развернуть" data-tooltip-placement="right"></button>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-lead">
          <button type="button" class="btn-nav-toggle" id="btn-nav-open" aria-label="Открыть меню" aria-controls="sidebar" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="topbar-titles">
            <h2 id="view-title">Заявки</h2>
            <p id="view-subtitle" class="muted">Единый реестр оптовых заказов клубов</p>
          </div>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <div id="sidebar-flyout" class="sidebar-flyout hidden" role="menu"></div>
  <div id="ui-tooltip" class="ui-tooltip hidden" role="tooltip"></div>

  <!-- Order drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="order-drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <p class="muted" id="drawer-kicker">Заявка</p>
        <h3 id="drawer-title">—</h3>
      </div>
      <button type="button" class="btn btn-ghost" id="drawer-close" aria-label="Закрыть" data-tooltip="Закрыть" data-tooltip-placement="left">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" id="modal">
      <div class="modal-head">
        <h3 id="modal-title">—</h3>
        <button type="button" class="btn btn-ghost" id="modal-close" aria-label="Закрыть" data-tooltip="Закрыть" data-tooltip-placement="left">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="avatars.js"></script>
  <script src="app.js"></script>
</body>
</html>
